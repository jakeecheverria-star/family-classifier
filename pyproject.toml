[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-classifier"
version = "0.1.0"
description = "Map Revit family naming conventions to Uniclass and IFC with an LLM and learned office rules."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=0.40"]
azure = ["openai>=1.40"]

[project.scripts]
family-classifier = "family_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
family_classifier = ["*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
